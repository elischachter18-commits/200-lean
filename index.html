  // ---- charts ----
  function lineChart(points, { goal = null, fmt = (v) => +v.toFixed(1), label = "Chart" } = {}) {
    if (points.length < 2) return `<p class="empty">The chart appears after two sessions.</p>`;
    const W = 360, H = 210, L = 38, R = 10, T = 18, B = 24;
    const t0 = points[0].t, t1 = points[points.length - 1].t;
    const all = points.map((p) => p.v).concat(goal !== null ? [goal] : []);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = Math.max(1, (hi - lo) * 0.12); lo -= pad; hi += pad;
    const step = [0.5, 1, 2, 5, 10, 20, 25, 50, 100].find((s) => (hi - lo) / s <= 5) || 200;
    const x = (t) => L + ((t - t0) / Math.max(DAY, t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    let g = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2c201d" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#a08f83" font-family="Oswald, sans-serif">${fmt(v)}</text>`;
    }
    [points[0], points[points.length - 1]].forEach((p, i) => {
      g += `<text x="${x(p.t)}" y="${H - 8}" text-anchor="${i ? "end" : "start"}" font-size="12" fill="#a08f83" font-family="Spectral, serif">${fmtDate(fromUTC(p.t))}</text>`;
    });
    if (goal !== null) g += `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${W - R}" y="${y(goal) - 6}" text-anchor="end" font-size="12" fill="#c9a24a" font-family="Oswald, sans-serif">GOAL ${fmt(goal)}</text>`;
    const pts = points.map((p) => `${x(p.t)},${y(p.v)}`).join(" ");
    const area = `<polygon points="${x(t0)},${H - B} ${pts} ${x(t1)},${H - B}" fill="url(#bloodfill)"/>`;
    const line = `<polyline points="${pts}" fill="none" stroke="#ff3b2f" stroke-width="2.5" stroke-linejoin="miter"/>`;
    const marks = points.map((p, i) => `<rect x="${x(p.t) - (i === points.length - 1 ? 5 : 3)}" y="${y(p.v) - (i === points.length - 1 ? 5 : 3)}" width="${i === points.length - 1 ? 10 : 6}" height="${i === points.length - 1 ? 10 : 6}" transform="rotate(45 ${x(p.t)} ${y(p.v)})" fill="#ff3b2f" stroke="#0b0707" stroke-width="1.5"/>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><linearGradient id="bloodfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3121b" stop-opacity=".35"/><stop offset="1" stop-color="#b3121b" stop-opacity="0"/></linearGradient></defs>${g}${area}${line}${marks}</svg>`;
  }

  // The bodyweight graph: every weigh-in as a dot, the 7-day average as the line, the phase target as a gold rule.
  function weightChart() {
    const all = Object.keys(weights).sort();
    if (!all.length) return `<p class="empty">Log a weigh-in and your graph starts here.</p>`;
    const days = RANGES.find((r) => r[0] === view.wRange)[2];
    const today = toUTC(todayStr());
    let dates = all.filter((d) => toUTC(d) > today - days * DAY);
    if (!dates.length) dates = all.slice(-1);
    const dots = dates.map((d) => ({ t: toUTC(d), v: weights[d] }));
    const avg = rolling(dates);
    const W = 360, H = 230, L = 36, R = 10, T = 20, B = 24;
    let t0 = dots[0].t, t1 = Math.max(dots[dots.length - 1].t, t0);
    if (t1 - t0 < 6 * DAY) { const mid = (t0 + t1) / 2; t0 = mid - 3 * DAY; t1 = mid + 3 * DAY; }
    const vals = dots.map((p) => p.v).concat(avg.map((p) => p.v));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = Math.max(hi - lo, 2);
    const tg = target();
    const showGoal = tg >= lo - span * 1.5 && tg <= hi + span * 1.5;
    if (showGoal) { lo = Math.min(lo, tg); hi = Math.max(hi, tg); }
    const pad = Math.max(0.6, (hi - lo) * 0.12); lo -= pad; hi += pad;
    const step = [0.5, 1, 2, 5, 10, 20].find((s) => (hi - lo) / s <= 5) || 50;
    const x = (t) => L + ((t - t0) / Math.max(DAY, t1 - t0)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    let g = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#2c201d" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#a08f83" font-family="Oswald, sans-serif">${+v.toFixed(1)}</text>`;
    }
    g += `<text x="${L}" y="${H - 8}" font-size="12" fill="#a08f83" font-family="Spectral, serif">${fmtDate(fromUTC(t0))}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="12" fill="#a08f83" font-family="Spectral, serif">${fmtDate(fromUTC(t1))}</text>`;
    if (showGoal) g += `<line x1="${L}" x2="${W - R}" y1="${y(tg)}" y2="${y(tg)}" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${W - R}" y="${y(tg) - 6}" text-anchor="end" font-size="12" fill="#c9a24a" font-family="Oswald, sans-serif">TARGET ${tg}</text>`;
    else g += `<text x="${L + 4}" y="${tg < lo ? H - B - 6 : T - 6}" font-size="11" fill="#c9a24a" font-family="Oswald, sans-serif">TARGET ${tg} ${tg < lo ? "↓" : "↑"} ${Math.abs(tg - avg[avg.length - 1].v).toFixed(1)} LB</text>`;
    const dd = dots.map((p) => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.2" fill="#ece2d4" fill-opacity=".45"/>`).join("");
    let line = "";
    if (avg.length > 1) {
      const pts = avg.map((p) => `${x(p.t)},${y(p.v)}`).join(" ");
      line = `<polygon points="${x(avg[0].t)},${H - B} ${pts} ${x(avg[avg.length - 1].t)},${H - B}" fill="url(#wfill)"/><polyline points="${pts}" fill="none" stroke="#ff3b2f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,59,47,.6))"/>`;
    }
    const last = avg[avg.length - 1];
    const lx = x(last.t), ly = y(last.v);
    const endMark = `<rect x="${lx - 6}" y="${ly - 6}" width="12" height="12" transform="rotate(45 ${lx} ${ly})" fill="#ff3b2f" stroke="#0b0707" stroke-width="2"/><text x="${Math.min(lx, W - R - 4)}" y="${ly - 12}" text-anchor="${lx > W - 80 ? "end" : "middle"}" font-size="15" font-weight="600" fill="#ece2d4" font-family="Oswald, sans-serif">${last.v.toFixed(1)}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight over time"><defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3121b" stop-opacity=".32"/><stop offset="1" stop-color="#b3121b" stop-opacity="0"/></linearGradient></defs>${g}${line}${dd}${endMark}</svg>
      ${all.length === 1 ? `<p class="flavor">One weigh-in so far. The red line, your 7-day average, appears from the second.</p>` : ""}`;
  }

  function sparkline() {
    const dates = Object.keys(weights).sort().filter((d) => toUTC(d) > toUTC(todayStr()) - 21 * DAY);
    if (dates.length < 2) return "";
    const pts = rolling(dates);
    const vs = pts.map((p) => p.v), lo = Math.min(...vs), hi = Math.max(...vs), r = Math.max(hi - lo, 0.5);
    const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    const xy = pts.map((p) => `${(((p.t - t0) / Math.max(DAY, t1 - t0)) * 116 + 2).toFixed(1)},${(30 - ((p.v - lo) / r) * 26).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 120 34" preserveAspectRatio="none" aria-hidden="true"><polyline points="${xy}" fill="none" stroke="#ff3b2f" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }

  // ---- views ----
  function render() {
    document.querySelectorAll("#tabs button").forEach((b) => {
      if (b.dataset.tab === view.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("tabs").hidden = authState === "out" || authState === "loading";
    if (authState === "out" || authState === "loading") { $("app").innerHTML = `<div class="wrap">${authView()}</div>`; tickRest(); return; }
    const html = view.tab === "workout" ? workoutView()
      : view.tab === "exercise" ? exerciseView()
      : view.tab === "progress" ? progressView()
      : view.tab === "weight" ? weightView()
      : view.tab === "settings" ? settingsView()
      : homeView();
    $("app").innerHTML = `<div class="wrap">${html}</div>`;
    tickRest();
  }

  function weighInPanel() {
    const t = todayStr();
    const date = view.weighDate || t;
    const dates = Object.keys(weights).sort();
    const ref = weights[date] ?? (dates.length ? weights[dates[dates.length - 1]] : 200);
    const whole = Math.floor(ref + 1e-6), tenth = Math.round((ref - whole) * 10) % 10;
    let wo = ""; for (let v = 140; v <= 260; v++) wo += `<option value="${v}"${v === whole ? " selected" : ""}>${v}</option>`;
    let to = ""; for (let v = 0; v <= 9; v++) to += `<option value="${v}"${v === tenth ? " selected" : ""}>${v}</option>`;
    const saved = weights[date];
    return `<section class="plate panel">
      <div class="top"><h2>${date === t ? "Morning weigh-in" : "Weigh-in for " + fmtDate(date)}</h2>
        ${view.weighDate ? `<input type="date" id="weigh-date" class="field" style="width:auto;min-height:36px;padding:4px 8px" value="${date}" max="${t}">` : `<button type="button" class="link" data-act="weigh-date">Other day</button>`}</div>
      <div class="weigh">
        <select class="pick" id="w-whole" aria-label="Pounds">${wo}</select><span class="dot">.</span>
        <select class="pick" id="w-tenth" aria-label="Tenths of a pound">${to}</select><span class="unit">lb</span>
        <button class="btn" type="button" data-act="weigh-save">${saved !== undefined ? "Update" : "Save"}</button>
      </div>
      ${saved !== undefined ? `<div class="saved">✓ Saved ${date === t ? "today" : fmtDate(date)}: <span class="num">${saved.toFixed(1)} lb</span></div>` : ""}
    </section>`;
  }

  function roadWeightCard() {
    const tr = weightTrend(), p = phase(), tg = target();
    const st = paceStatus(tr.rate);
    const title = p === "cut" ? `Road to ${tg}` : p === "bulk" ? `Lean bulk to ${tg}` : `Holding ${tg}`;
    if (tr.cur === null) return `<button type="button" class="road plate" data-act="tab" data-tab="weight"><h2>${title}</h2><p class="empty">Log a weigh-in to start the road.</p></button>`;
    const left = tr.cur - tg;
    let pct = 0;
    if (tr.start !== null && tr.start !== tg) pct = Math.max(0, Math.min(1, (tr.start - tr.cur) / (tr.start - tg)));
    let eta = "";
    if (tr.rate && ((p === "cut" && tr.rate < 0 && left > 0) || (p === "bulk" && tr.rate > 0 && left < 0))) {
      const wks = Math.abs(left / tr.rate);
      eta = `ETA ${fmtDate(fromUTC(toUTC(todayStr()) + Math.round(wks * 7) * DAY))}`;
    }
    const leftTxt = p === "maintain" ? `${sign(-left)} from target` : Math.abs(left) < 0.3 ? "At target" : `${Math.abs(left).toFixed(1)} lb ${left > 0 ? "to lose" : "to gain"}`;
    return `<button type="button" class="road plate" data-act="tab" data-tab="weight">
      <h2>${title}</h2>
      <div class="big num">${tr.cur.toFixed(1)}<small> lb avg</small></div>
      ${sparkline() || `<div class="bar"><i style="width:${(pct * 100).toFixed(0)}%"></i></div>`}
      <div class="line2">${leftTxt}${tr.rate !== null ? ` · <span class="num">${sign(tr.rate, 2)}</span>/wk` : ""}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="pill ${st.cls}">${st.text}</span>${eta ? `<span class="line2">${eta}</span>` : ""}</div>
    </button>`;
  }

  function road315Card() {
    const b = benchNow();
    const cur = Math.round(b.cur);
    const pct = Math.min(1, b.cur / BENCH_GOAL);
    const note = b.cur >= 320 ? { cls: "good", t: "Ready to try 315" } : b.cur >= 305 ? { cls: "info", t: "The castle is close" } : { cls: "info", t: `${BENCH_GOAL - cur} lb to go` };
    return `<button type="button" class="road plate castle" data-act="open-ex" data-ex="bench">
      ${castleIcon}
      <h2>Road to 315</h2>
      <div class="big num">~${cur}<small> est. max</small></div>
      <div class="bar"><i style="width:${(pct * 100).toFixed(0)}%"></i><b></b></div>
      <div class="line2">${b.baseline ? `From ${BENCH_BASE.w}×${BENCH_BASE.r}, your starting set` : b.h.length < 2 ? "1 session logged" : `${sign(b.change, 0)} lb in 4 weeks`}</div>
      <span class="pill ${note.cls}">${note.t}</span>
    </button>`;
  }

  function authView() {
    if (authState === "loading") return `${skyHTML(false, "200 Lean", "")}<p class="flavor" style="text-align:center">Opening the gates…</p>`;
    return `${skyHTML(false, "200 Lean", "")}
      <section class="plate panel auth">
        <h2>Sign in to sync</h2>
        <p class="flavor">Your lifts and weigh-ins sync between your phone and laptop. Use the same email and password on both.</p>
        <label class="lab" for="auth-email">Email<input class="field" id="auth-email" type="email" autocomplete="username" inputmode="email" value="${esc(auth.email)}"></label>
        <label class="lab" for="auth-pass">Password<input class="field" id="auth-pass" type="password" autocomplete="current-password" value="${esc(auth.pass)}"></label>
        ${auth.err ? `<p class="err" role="alert">${esc(auth.err)}</p>` : ""}${auth.msg ? `<p class="ok" role="status">${esc(auth.msg)}</p>` : ""}
        <div class="row2"><button type="button" class="btn" data-act="signin"${auth.busy ? " disabled" : ""}>Sign in</button><button type="button" class="btn quiet" data-act="signup"${auth.busy ? " disabled" : ""}>Create account</button></div>
        <button type="button" class="link" data-act="reset" style="align-self:flex-start">Forgot password?</button>
      </section>`;
  }

  function homeView() {
    const all = sortedSessions();
    const lastBy = {};
    all.forEach((s) => { lastBy[s.day] = s; });
    const t = todayStr();
    const ex = exs();
    const days = DAYS.map((d) => {
      const todays = sessions[`s-${t}-${d.id}`];
      const live = isActive(todays);
      const last = lastBy[d.id];
      const names = dayList(d.id).map((id) => ex[id] ? ex[id].name : null).filter(Boolean).join(" · ");
      const dur = last && duration(last);
      const meta = live ? `<span class="pill info">In progress</span>`
        : todays ? `<span class="pill good">Done${dur ? " · " + fmtDur(dur) : ""}</span>`
        : last ? `${relDay(last.date)}${dur ? `<br><span class="num">${fmtDur(dur)}</span>` : ""}` : "Not yet";
      return `<button type="button" class="day plate${live ? " live" : ""}" data-act="start" data-day="${d.id}"><div><div class="t">${d.name}</div><div class="ex">${esc(names)}</div></div><div class="meta">${meta}</div></button>`;
    }).join("");
    return `${skyHTML()}
      ${synced ? "" : `<p class="flavor" style="margin:0">Sync isn't set up yet, so what you log stays on this device.</p>`}
      ${weighInPanel()}
      <div class="roads">${roadWeightCard()}${road315Card()}</div>
      <section style="display:flex;flex-direction:column;gap:10px"><h2>Choose today's battle</h2><div class="days">${days}</div></section>
      <section class="plate panel"><h2>Monthly check-in</h2><p class="flavor">Copies your last 4 weeks of lifts and bodyweight so you can paste them to Claude when planning your next block.</p>
        <button class="btn quiet wide" type="button" data-act="copy">Copy summary for Claude</button>
        ${view.copyText ? `<textarea class="copy" id="copy-text" readonly>${esc(view.copyText)}</textarea><p class="small muted" style="margin:0">Copying was blocked here. Select the text above and copy it.</p>` : ""}
      </section>`;
  }

  function currentSession() {
    const id = view.sessionId;
    if (sessions[id]) return sessions[id];
    const [, y, m, d, ...rest] = id.split("-");
    return { day: rest.join("-"), date: `${y}-${m}-${d}`, ts: Date.now(), sets: {} };
  }

  function defaultWeight(exId, sess, idx) {
    const cur = setList(sess, exId);
    for (let i = idx - 1; i >= 0; i--) if (cur[i] && cur[i].w) return cur[i].w;
    const last = lastTime(exId, view.sessionId);
    if (last) { const ls = setList(last, exId); if (ls[idx] && ls[idx].w) return ls[idx].w; const any = ls.find((s) => s && s.w); if (any) return any.w; }
    return exs()[exId].start || 50;
  }
  function sameRef(exId, sess, idx) {
    const cur = setList(sess, exId);
    if (idx > 0 && cur[idx - 1]) return cur[idx - 1];
    const last = lastTime(exId, view.sessionId);
    if (last) { const ls = setList(last, exId); return ls[idx] || ls.find(Boolean) || null; }
    return null;
  }

  function editorHTML(exId, sess, idx) {
    const ex = exs()[exId];
    const existing = setList(sess, exId)[idx];
    const ref = existing ? null : sameRef(exId, sess, idx);
    let picker = "";
    if (ex.kind === "w") {
      const wv = pickW[exId] ?? (existing ? existing.w : defaultWeight(exId, sess, idx));
      pickW[exId] = wv;
      let o = ""; for (let v = 5; v <= 600; v += 5) o += `<option value="${v}"${v === wv ? " selected" : ""}>${v}</option>`;
      if (wv % 5) o = `<option value="${wv}" selected>${wv}</option>` + o;
      picker = `<div class="row"><span class="k">Weight</span><select class="pick" id="pick-${exId}" data-pick="${exId}" aria-label="Weight in pounds">${o}</select><span class="muted">lb</span></div>`;
    }
    let body;
    if (ex.kind === "t") {
      const last = lastTime(exId, view.sessionId);
      const lastS = last ? (setList(last, exId).find(Boolean) || {}).s : null;
      const sv = pickS[exId] ?? (existing ? existing.s : lastS || 60);
      pickS[exId] = sv;
      let o = ""; for (let v = 15; v <= 300; v += 15) o += `<option value="${v}"${v === sv ? " selected" : ""}>${v}s</option>`;
      if (sv % 15) o = `<option value="${sv}" selected>${sv}s</option>` + o;
      body = `<div class="row"><span class="k">Hold</span><select class="pick" id="pick-${exId}" data-picks="${exId}" aria-label="Seconds">${o}</select><button class="btn" type="button" data-act="log-time" data-ex="${exId}" data-i="${idx}">Log set ${idx + 1}</button></div>`;
    } else {
      let chips = "";
      for (let r = 1; r <= 15; r++) chips += `<button type="button" class="chip${existing && existing.r === r ? " cur" : ""}" data-act="rep" data-ex="${exId}" data-i="${idx}" data-r="${r}">${r}</button>`;
      body = `<div class="k">Set ${idx + 1} · tap reps to log</div><div class="chips">${chips}</div>`;
    }
    const same = ref ? `<button type="button" class="same" data-act="same" data-ex="${exId}" data-i="${idx}">Same as ${idx > 0 && setList(sess, exId)[idx - 1] ? "last set" : "last time"}<span class="num">${fmtSet(ex, ref)}</span></button>` : "";
    const extra = existing ? `<div class="row"><button type="button" class="btn danger" data-act="clear-set" data-ex="${exId}" data-i="${idx}">Remove set</button><button type="button" class="btn ghost" data-act="cancel-edit">Cancel</button></div>` : "";
    return `<div class="editor">${same}${picker}${body}${extra}</div>`;
  }

  function exCardHTML(exId, sess) {
    const ex = exs()[exId];
    if (!ex) return "";
    const sets = setList(sess, exId);
    const n = sets.filter(Boolean).length;
    const last = lastTime(exId, view.sessionId);
    const lastTxt = last ? `Last (${relDay(last.date)}): ${fmtSets(ex, setList(last, exId))}` : "First time logging this";
    const open = view.open === exId;
    let bodyHTML = "";
    if (open) {
      const next = sets.findIndex((s) => !s);
      // a finished workout only lets you correct logged sets, not add new ones
      const editIdx = view.editing && view.editing.ex === exId ? view.editing.i : sess.endedAt ? -1 : next;
      const rows = sets.map((s, i) => {
        if (i === editIdx) return editorHTML(exId, sess, i);
        if (s) return `<button type="button" class="setrow" data-act="edit-set" data-ex="${exId}" data-i="${i}"><span class="k">Set ${i + 1}</span><span class="v">${fmtSet(ex, s)}</span>${isPR(exId, sess, s) ? `<span class="pill pr">PR</span>` : ""}</button>`;
        return `<div class="setrow pending"><span class="k">Set ${i + 1}</span></div>`;
      }).join("");
      bodyHTML = `<div class="exbody">${rows}<button type="button" class="link" data-act="open-ex" data-ex="${exId}" style="align-self:flex-start">History and chart</button></div>`;
    }
    return `<article class="excard plate${open ? " open" : ""}${n === 3 && !open ? " done" : ""}" id="card-${exId}">
      <button type="button" class="exhead" data-act="toggle" data-ex="${exId}" aria-expanded="${open}"><div><div class="n">${esc(ex.name)}</div><div class="last">${esc(lastTxt)}</div></div>
      <div class="dots" aria-label="${n} of 3 sets">${sets.map((s) => `<i class="${s ? "on" : ""}"></i>`).join("")}</div></button>${bodyHTML}</article>`;
  }

  function workoutView() {
    const sess = currentSession();
    const d = DAYS.find((x) => x.id === sess.day) || { name: sess.day };
    const list = dayList(sess.day);
    const ex = exs();
    if (view.open === null && !sess.endedAt) {
      view.open = list.find((id) => setList(sess, id).filter(Boolean).length < 3) || null;
    }
    let editHTML = "";
    if (view.editMode) {
      const avail = Object.keys(ex).filter((id) => !list.includes(id)).sort((a, b) => ex[a].name.localeCompare(ex[b].name));
      editHTML = `<section class="plate panel"><h2>Exercises on ${esc(d.name)}</h2>
        <ul class="editlist">${list.map((id, i) => `<li><span>${esc(ex[id] ? ex[id].name : id)}</span>
          <button type="button" class="iconbtn" data-act="mv" data-ex="${id}" data-d="-1" aria-label="Move up"${i === 0 ? " disabled" : ""}>↑</button>
          <button type="button" class="iconbtn" data-act="mv" data-ex="${id}" data-d="1" aria-label="Move down"${i === list.length - 1 ? " disabled" : ""}>↓</button>
          <button type="button" class="iconbtn" data-act="rm-ex" data-ex="${id}" aria-label="Remove from this day">✕</button></li>`).join("")}</ul>
        ${avail.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><select class="pick sm" id="add-ex" style="flex:1;min-width:0">${avail.map((id) => `<option value="${id}">${esc(ex[id].name)}</option>`).join("")}</select><button type="button" class="btn" data-act="add-ex">Add</button></div>` : ""}
        <details><summary class="small">New exercise</summary>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
            <label class="lab" for="new-name">Name<input class="field" id="new-name" maxlength="40" placeholder="Incline bench"></label>
            <label class="lab" for="new-kind">Type<select class="field" id="new-kind"><option value="w">Weight + reps</option><option value="bw">Bodyweight reps</option><option value="t">Timed hold</option></select></label>
            <button type="button" class="btn" data-act="new-ex">Create and add</button></div></details>
        <p class="flavor">Exercises are shared across days. Removing one from this day keeps its history.</p>
        <button type="button" class="btn quiet" data-act="edit-mode">Done editing</button></section>`;
    }
    const total = list.length * 3, done = list.reduce((a, id) => a + setList(sess, id).filter(Boolean).length, 0);
    const left = total - done;
    const ended = !!sess.endedAt;
    const dur = duration(sess);
    const endedHTML = ended ? `<section class="plate panel ended"><h2>Workout ended</h2>
        <div class="endline"><span class="num big">${dur ? fmtDur(dur) : "—"}</span><span class="muted">${setCount(sess)} set${setCount(sess) === 1 ? "" : "s"} · finished ${new Date(sess.endedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}${left > 0 ? ` · ${left} skipped` : ""}</span></div>
        <p class="flavor">Tap a logged set to fix it. To keep training, resume.</p>
        <button type="button" class="btn quiet" data-act="resume">Resume workout</button></section>` : "";
    const finishBtn = ended
      ? `<button type="button" class="btn" style="flex:1" data-act="tab" data-tab="home">Back home</button>`
      : `<button type="button" class="btn${view.confirmFinish ? " danger" : ""}" style="flex:1" data-act="finish">${view.confirmFinish ? `End with ${left} sets left?` : "Finish workout"}</button>`;
    return `${skyHTML(true, d.name, `<span class="wk"><span class="num" id="wk-clock">0:00</span><span class="small">${done} / ${total} sets</span></span>`)}
      <header class="top"><button type="button" class="back" data-act="tab" data-tab="home">‹ Home</button><span class="flavor">${sess.date === todayStr() ? "Today" : fmtDate(sess.date)} · 3 sets · 2:00 rest</span></header>
      ${endedHTML}
      ${list.map((id) => exCardHTML(id, sess)).join("")}
      ${editHTML || `<div style="display:flex;gap:10px"><button type="button" class="btn quiet" style="flex:1" data-act="edit-mode">Edit exercises</button>${finishBtn}</div>
      ${view.confirmFinish ? `<p class="flavor" style="text-align:right">Tap again to end it. Skipped exercises stay empty.</p>` : ""}`}`;
  }

  function exerciseView() {
    const exId = view.exId, ex = exs()[exId];
    if (!ex) { view.tab = "progress"; return progressView(); }
    const h = history(exId);
    const pts = h.map((s) => ({ t: toUTC(s.date), v: sessionMetric(ex, s, exId) }));
    const isBench = exId === "bench";
    const best = pts.length ? Math.max(...pts.map((p) => p.v)) : null;
    let bestSet = null;
    h.forEach((s) => setList(s, exId).forEach((x) => { if (x && (!bestSet || setScore(ex, x) > setScore(ex, bestSet))) bestSet = x; }));
    const b = isBench ? benchNow() : null;
    const benchNote = isBench ? (b.cur >= 320 ? "Your estimated max is past 320. A true 315 single is likely there. Try it on a fresh day with a spotter." : b.cur >= 305 ? "Within about 10 lb of the castle. Keep pushing your top set; heavier triples will tell you when." : `About ${Math.round(BENCH_GOAL - b.cur)} lb of estimated max to go.`) : "";
    const back = view.from === "workout" ? `<button type="button" class="back" data-act="back-workout">‹ Back to workout</button>` : `<button type="button" class="back" data-act="tab" data-tab="${view.from || "progress"}">‹ Back</button>`;
    return `<header class="top">${back}</header>
      <div><h1>${isBench ? "Road to 315" : esc(ex.name)}</h1>${isBench ? `<div class="flavor" style="margin-top:6px">Flat bench · the castle on the hill</div>` : ""}</div>
      <div class="stats">
        <div class="stat plate"><span class="k">${isBench ? "Est. max now" : metricLabel(ex)}</span><span class="v">${isBench ? "~" + Math.round(b.cur) : pts.length ? metricFmt(ex, pts[pts.length - 1].v) : "—"}</span><span class="s">${isBench && b.baseline ? `From ${BENCH_BASE.w}×${BENCH_BASE.r}` : pts.length ? "Latest session" : "No sessions yet"}</span></div>
        <div class="stat plate"><span class="k">Best set</span><span class="v">${bestSet ? fmtSet(ex, bestSet) : isBench ? `${BENCH_BASE.w}×${BENCH_BASE.r}` : "—"}</span><span class="s">${best !== null ? `Best ${metricLabel(ex).toLowerCase()}: ${metricFmt(ex, best)}` : isBench ? "Your starting point" : "Log a set to see it"}</span></div>
      </div>
      ${isBench ? `<section class="plate panel castle" style="position:relative">${castleIcon.replace('class="castle-ico"', 'class="castle-ico" style="position:absolute;right:14px;top:12px;width:44px;height:34px"')}<h2>To the castle</h2><div class="bar" style="margin-right:56px"><i style="width:${Math.min(100, (b.cur / BENCH_GOAL) * 100).toFixed(0)}%"></i><b></b></div><p class="small" style="margin:0">${benchNote}</p></section>` : ""}
      <section class="plate panel chart"><h2>${metricLabel(ex)} per session</h2>${lineChart(pts, { goal: isBench ? BENCH_GOAL : null, fmt: (v) => Math.round(v), label: `${ex.name} ${metricLabel(ex)} over time` })}
        ${ex.kind === "w" ? `<p class="flavor">Estimated max comes from your best set each session, so you never need to test a true max.</p>` : ex.kind === "bw" ? `<p class="flavor">Total reps across your 3 sets.</p>` : ""}</section>
      <section class="plate panel"><h2>Sessions</h2>${h.length ? `<ul class="list">${h.slice().reverse().map((s) => `<li><span>${fmtDate(s.date)} <span class="muted small">${esc((DAYS.find((d) => d.id === s.day) || { name: s.day }).name)}</span></span><span class="num">${fmtSets(ex, setList(s, exId))}</span></li>`).join("")}</ul>` : `<p class="empty">Sessions show here once you log this exercise.</p>`}</section>`;
  }

  function progressView() {
    const ex = exs();
    const used = new Set();
    DAYS.forEach((d) => dayList(d.id).forEach((id) => used.add(id)));
    Object.values(sessions).forEach((s) => Object.keys(s.sets || {}).forEach((id) => used.add(id)));
    const rows = [...used].filter((id) => ex[id]).map((id) => {
      const h = history(id);
      const e = ex[id];
      if (!h.length) return { id, name: e.name, txt: "No sessions yet", chg: null, n: 0 };
      const last = sessionMetric(e, h[h.length - 1], id);
      const old = h.filter((s) => toUTC(s.date) <= toUTC(todayStr()) - 28 * DAY);
      const then = old.length ? sessionMetric(e, old[old.length - 1], id) : sessionMetric(e, h[0], id);
      return { id, name: e.name, txt: `${metricLabel(e)} ${metricFmt(e, last)}`, chg: h.length > 1 ? last - then : null, n: h.length, kind: e.kind };
    }).sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
    return `<header class="top"><h1>Progress</h1></header>
      ${road315Card()}
      <section class="plate panel"><h2>Every lift</h2><div>${rows.map((r) => `<button type="button" class="rowbtn" data-act="open-ex" data-ex="${r.id}"><span><span class="n">${esc(r.name)}</span><br><span class="small muted">${r.txt}</span></span>
        <span class="num ${r.chg > 0 ? "down" : r.chg < 0 ? "up" : "muted"}">${r.chg === null ? "" : `${sign(r.chg, 0)}${r.kind === "w" ? " lb" : r.kind === "t" ? "s" : ""}`}</span></button>`).join("")}</div>
        <p class="flavor">Change compares your latest session with about 4 weeks ago.</p></section>`;
  }

  function weightView() {
    const tr = weightTrend();
    const data = weights;
    const dates = Object.keys(data).sort();
    const weeks = tr.weeks;
    const last = weeks[weeks.length - 1], first = weeks[0];
    const total = weeks.length > 1 ? last.avg - first.avg : null;
    const st = paceStatus(tr.rate);
    const stat = (k, v, s, c = "") => `<div class="stat plate"><span class="k">${k}</span><span class="v ${c}">${v}</span><span class="s">${s}</span></div>`;
    const cls = (v) => v === null ? "" : (phase() === "bulk" ? (v > 0 ? "down" : "up") : (v < 0 ? "down" : v > 0 ? "up" : ""));
    return `<header class="top"><h1>Weight</h1><span class="pill ${st.cls}">${st.text}</span></header>
      <section class="plate panel chart">
        <div class="chart-head"><h2>Bodyweight</h2><div class="ranges" role="group" aria-label="Range">${RANGES.map(([k, l]) => `<button type="button" data-act="range" data-r="${k}" aria-pressed="${view.wRange === k}">${l}</button>`).join("")}</div></div>
        ${weightChart()}
        <div class="legend"><span><i style="background:#ece2d4;opacity:.5;height:6px;width:6px;border-radius:50%"></i>Daily weigh-in</span><span><i style="background:#ff3b2f"></i>7-day average</span><span><i style="background:#c9a24a"></i>Target ${target()}</span></div>
      </section>
      ${weighInPanel()}
      <section class="stats">
        ${stat("Avg weekly change", tr.rate === null ? "—" : `${sign(tr.rate, 2)} lb`, tr.rate === null ? "Needs two weeks of weigh-ins" : `Last ${tr.basis.length} week${tr.basis.length === 1 ? "" : "s"}`, cls(tr.rate))}
        ${stat("This week's average", last ? `${last.avg.toFixed(1)}` : "—", last ? `Week ${last.wk} · ${last.n} of 7 weigh-ins` : "No weigh-ins yet")}
        ${stat("Total since start", total === null ? "—" : `${sign(total)} lb`, total === null ? (first ? `Week 1 avg ${first.avg.toFixed(1)}` : "—") : `${sign((total / first.avg) * 100, 1)}% from week 1`, cls(total))}
        ${stat(`To ${target()}`, tr.cur === null ? "—" : `${Math.abs(tr.cur - target()).toFixed(1)} lb`, `${PHASES[phase()].name} phase`)}
      </section>
      <section class="plate panel"><h2>Week by week</h2><div class="table-scroll"><table>
        <thead><tr><th>Week</th><th>Dates</th><th class="r">Days</th><th class="r">Avg</th><th class="r">Change</th></tr></thead>
        <tbody>${weeks.slice().reverse().map((w) => `<tr><td>${w.wk}${w.live ? ' <span class="pill info">now</span>' : ""}</td><td>${fmtDate(w.from)} – ${fmtDate(w.to)}</td><td class="r num">${w.n}</td><td class="r num">${w.avg.toFixed(1)}</td><td class="r num ${w.change === undefined ? "" : cls(w.change)}">${w.change === undefined ? "—" : sign(w.change, 2)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No weigh-ins yet.</td></tr>`}</tbody>
      </table></div></section>
      <section class="plate panel"><details><summary>All weigh-ins (${dates.length})</summary>
        <ul class="list" style="margin-top:8px">${dates.slice().reverse().map((d) => `<li><span>${fmtDate(d)} <span class="num small muted">${d.slice(0, 4)}</span></span><span style="display:flex;gap:12px;align-items:center"><span class="num">${data[d].toFixed(1)}</span><button type="button" class="btn ${view.pendingDelete === d ? "danger" : "quiet"}" style="min-height:34px;padding:4px 10px;font-size:0.72rem" data-act="del-weight" data-d="${d}">${view.pendingDelete === d ? "Tap to confirm" : "Delete"}</button></span></li>`).join("") || `<li class="empty">Your weigh-ins will show here.</li>`}</ul></details></section>`;
  }

  function settingsView() {
    const p = phase();
    let to = ""; for (let v = 160; v <= 240; v++) to += `<option value="${v}"${v === target() ? " selected" : ""}>${v} lb</option>`;
    const band = p === "cut" ? "On pace = losing 0.5–1.5 lb a week. Faster than 1.5 risks muscle." : p === "bulk" ? "On pace = gaining 0.25–0.5 lb a week. Faster than that is mostly fat." : "Holding = within 0.5 lb a week of steady.";
    return `<header class="top"><h1>Goals</h1></header>
      <section class="plate panel"><h2>Phase</h2>
        <label class="lab" for="set-phase">Current phase<select class="pick sm" id="set-phase">${Object.entries(PHASES).map(([k, v]) => `<option value="${k}"${k === p ? " selected" : ""}>${v.name}</option>`).join("")}</select></label>
        <label class="lab" for="set-target">Target weight<select class="pick sm" id="set-target">${to}</select></label>
        <p class="flavor">${band}</p></section>
      <section class="plate panel"><h2>The campaign</h2><ul class="list small">
        <li><span><b>1. Cut</b> to 185</span><span class="pill ${p === "cut" ? "info" : ""}" style="${p === "cut" ? "" : "visibility:hidden"}">Now</span></li>
        <li><span><b>2. Lean bulk</b> 185 → 215, slowly, over 1–2 years</span><span class="pill info" style="${p === "bulk" ? "" : "visibility:hidden"}">Now</span></li>
        <li><span><b>3. Final cut</b> to about 205 at 12%</span><span></span></li>
        <li><span><b>Always:</b> bench 315</span><span></span></li></ul></section>
      <section class="plate panel"><h2>Rest timer</h2><p class="small" style="margin:0">2:00, silent. It starts when you log a set and stays accurate if you lock your phone. The red ring closes as you rest; when it's full, the bar burns red and says GO.</p></section>
      <section class="plate panel"><h2>Account</h2>
        ${authState === "in" ? `<p class="small" style="margin:0">Signed in as <b>${esc(account.email || "")}</b>. Everything syncs, and works offline at the gym.</p>
        <button type="button" class="btn ghost" data-act="signout">Sign out</button>` : `<p class="small" style="margin:0">Sync isn't set up yet, so your data stays on this device.</p>`}</section>
      <section class="plate panel"><h2>Backup</h2>
        <p class="flavor">Save a copy of everything, or bring in a backup, such as your data from the Claude version.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn quiet" style="flex:1" data-act="export">Save backup</button>
        <label class="btn quiet filebtn" style="flex:1" for="import-file">Import backup<input type="file" id="import-file" accept="application/json,.json"></label></div></section>`;
  }

  // ---- summary for Claude ----
  function buildSummary() {
    const t = todayStr(), from = fromUTC(toUTC(t) - 27 * DAY);
    const tr = weightTrend();
    const ex = exs();
    const recent = sortedSessions().filter((s) => s.date >= from);
    const lines = [`200 Lean summary, ${fmtDate(from)} to ${fmtDate(t)}`, `Phase: ${PHASES[phase()].name}, target ${target()} lb. Bench goal 315.`, ""];
    lines.push("BODYWEIGHT");
    tr.weeks.filter((w) => w.to >= from).forEach((w) => lines.push(`Week ${w.wk} (${fmtDate(w.from)}): avg ${w.avg.toFixed(1)} lb, ${w.n} weigh-ins${w.change !== undefined ? `, ${sign(w.change, 2)}` : ""}`));
    if (tr.rate !== null) lines.push(`Average weekly change: ${sign(tr.rate, 2)} lb`);
    lines.push("", `SESSIONS: ${recent.length}`);
    const counts = {};
    recent.forEach((s) => { counts[s.day] = (counts[s.day] || 0) + 1; });
    lines.push(DAYS.filter((d) => counts[d.id]).map((d) => `${d.name} ×${counts[d.id]}`).join(", ") || "None logged");
    const durs = recent.map(duration).filter(Boolean);
    if (durs.length) lines.push(`Average workout: ${fmtDur(durs.reduce((a, b) => a + b, 0) / durs.length)}`);
    const short = recent.filter((s) => setCount(s) < dayList(s.day).length * 3);
    if (short.length) lines.push(`Ended early: ${short.map((s) => `${fmtDate(s.date)} ${(DAYS.find((d) => d.id === s.day) || { name: s.day }).name} (${setCount(s)}/${dayList(s.day).length * 3} sets)`).join(", ")}`);
    lines.push("", "LIFTS (3 sets each)");
    Object.keys(ex).forEach((id) => {
      const h = history(id).filter((s) => s.date >= from);
      if (!h.length) return;
      const e = ex[id];
      const ms = h.map((s) => sessionMetric(e, s, id));
      const stalled = ms.length >= 3 && Math.max(...ms.slice(-2)) <= ms[ms.length - 3];
      lines.push(`${e.name}: ${metricLabel(e).toLowerCase()} ${metricFmt(e, ms[0])} → ${metricFmt(e, ms[ms.length - 1])}${stalled ? " (STALLED last 3 sessions)" : ""}`);
      h.forEach((s) => lines.push(`  ${fmtDate(s.date)}: ${fmtSets(e, setList(s, id))}`));
    });
    const b = benchNow();
    lines.push("", `Bench est. max now: ~${Math.round(b.cur)} lb`);
    return lines.join("\n");
  }

  // ---- actions ----
  function saveLib(next) { lib = next; put("lib", JSON.parse(JSON.stringify(lib))); render(); }
  function mutableDays() { return { ...(lib.days || {}) }; }

  function logSet(exId, idx, data) {
    const sess = JSON.parse(JSON.stringify(currentSession()));
    const prev = setList(sess, exId)[idx];
    const wasNew = !prev;
    const now = Date.now();
    // the clock starts when you opened the day, unless the first set came much later
    if (!sess.startedAt) sess.startedAt = view.openedAt && now - view.openedAt < 10 * 60000 ? view.openedAt : now;
    data = { ...data, t: prev && prev.t ? prev.t : now };
    sess.sets[exId] = { ...(sess.sets[exId] || {}), [idx]: data };
    sessions[view.sessionId] = sess;
    put(view.sessionId, sess);
    view.editing = null;
    if (wasNew) startRest();
    const full = setList(sess, exId).every(Boolean);
    if (full && wasNew) {
      const list = dayList(sess.day);
      const next = list.find((id) => id !== exId && setList(sess, id).filter(Boolean).length < 3);
      view.open = next || null;
      render();
      if (next) { const c = $("card-" + next); if (c) c.scrollIntoView({ block: "start", behavior: "smooth" }); }
      return;
    }
    render();
  }

  document.addEventListener("click", async (e) => {
    const el = e.target.closest("[data-act],[data-tab]");
    if (!el) return;
    const act = el.dataset.act || "tab";
    const exId = el.dataset.ex, idx = el.dataset.i !== undefined ? Number(el.dataset.i) : null;
    if (act !== "del-weight") view.pendingDelete = null;
    if (act !== "finish") view.confirmFinish = false;
    switch (act) {
      case "tab":
        view.tab = el.dataset.tab; view.copyText = null; view.editMode = false; render(); window.scrollTo(0, 0); break;
      case "start": {
        const id = `s-${todayStr()}-${el.dataset.day}`;
        view.tab = "workout"; view.sessionId = id; view.open = null; view.editing = null; view.editMode = false;
        if (!sessions[id]) view.openedAt = Date.now();
        Object.keys(pickW).forEach((k) => delete pickW[k]);
        Object.keys(pickS).forEach((k) => delete pickS[k]);
        render(); window.scrollTo(0, 0); break;
      }
      case "toggle":
        view.open = view.open === exId ? "" : exId; view.editing = null; delete pickW[exId]; render(); break;
      case "rep": {
        const ex = exs()[exId];
        logSet(exId, idx, ex.kind === "w" ? { w: Number(pickW[exId]), r: Number(el.dataset.r) } : { r: Number(el.dataset.r) });
        break;
      }
      case "log-time": logSet(exId, idx, { s: Number(pickS[exId]) }); break;
      case "same": {
        const ref = sameRef(exId, currentSession(), idx);
        if (ref) { if (ref.w) pickW[exId] = ref.w; logSet(exId, idx, { ...ref }); }
        break;
      }
      case "edit-set": {
        const s = setList(currentSession(), exId)[idx];
        view.editing = { ex: exId, i: idx };
        if (s && s.w) pickW[exId] = s.w;
        if (s && s.s) pickS[exId] = s.s;
        render(); break;
      }
      case "cancel-edit": view.editing = null; delete pickW[exId]; render(); break;
      case "clear-set": {
        const sess = JSON.parse(JSON.stringify(currentSession()));
        if (sess.sets[exId]) delete sess.sets[exId][idx];
        if (sess.sets[exId] && !Object.keys(sess.sets[exId]).length) delete sess.sets[exId];
        view.editing = null;
        if (Object.keys(sess.sets).length) { sessions[view.sessionId] = sess; put(view.sessionId, sess); }
        else if (sessions[view.sessionId]) { delete sessions[view.sessionId]; put(view.sessionId, null); }
        render(); break;
      }
      case "finish": {
        const cur = sessions[view.sessionId];
        const n = cur ? setCount(cur) : 0;
        const total = dayList(currentSession().day).length * 3;
        if (n && n < total && !view.confirmFinish) { view.confirmFinish = true; render(); break; }
        view.confirmFinish = false;
        stopRest();
        if (n) {
          const sess = JSON.parse(JSON.stringify(cur));
          sess.endedAt = Date.now();
          sessions[view.sessionId] = sess;
          put(view.sessionId, sess);
        }
        view.tab = "home"; render(); window.scrollTo(0, 0);
        if (n) { const s = sessions[view.sessionId], dur = duration(s); toast(`Workout ended: ${n} set${n === 1 ? "" : "s"}${dur ? " in " + fmtDur(dur) : ""}`); }
        else toast("Nothing logged, so nothing was saved");
        break;
      }
      case "resume": {
        const sess = JSON.parse(JSON.stringify(currentSession()));
        delete sess.endedAt;
        sessions[view.sessionId] = sess;
        put(view.sessionId, sess);
        view.open = null; render(); break;
      }
      case "signin": doAuth("in"); break;
      case "signup": doAuth("up"); break;
      case "reset": doAuth("reset"); break;
      case "signout": firebase.auth().signOut(); view.tab = "home"; break;
      case "export": exportData(); break;
      case "noop": break;
      case "rest-skip": stopRest(); break;
      case "open-ex":
        view.from = view.tab === "exercise" ? view.from : view.tab; view.exId = exId; view.tab = "exercise"; render(); window.scrollTo(0, 0); break;
      case "back-workout": view.tab = "workout"; render(); break;
      case "edit-mode": view.editMode = !view.editMode; render(); break;
      case "range":
        view.wRange = el.dataset.r;
        try { localStorage.setItem("lean200.range", view.wRange); } catch {}
        render(); break;
      case "mv": {
        const d = currentSession().day, list = dayList(d).slice(), i = list.indexOf(exId), j = i + Number(el.dataset.d);
        if (j < 0 || j >= list.length) break;
        [list[i], list[j]] = [list[j], list[i]];
        saveLib({ ...lib, days: { ...mutableDays(), [d]: list } }); break;
      }
      case "rm-ex": {
        const d = currentSession().day;
        saveLib({ ...lib, days: { ...mutableDays(), [d]: dayList(d).filter((x) => x !== exId) } }); break;
      }
      case "add-ex": {
        const d = currentSession().day, id = $("add-ex").value;
        if (id) saveLib({ ...lib, days: { ...mutableDays(), [d]: [...dayList(d), id] } });
        break;
      }
      case "new-ex": {
        const name = $("new-name").value.trim(), kind = $("new-kind").value;
        if (!name) { toast("Give the exercise a name first."); break; }
        const id = "c" + Date.now().toString(36);
        const d = currentSession().day;
        saveLib({ ...lib, custom: { ...(lib.custom || {}), [id]: { name, kind } }, days: { ...mutableDays(), [d]: [...dayList(d), id] } });
        toast(`Added ${name}`); break;
      }
      case "weigh-date": view.weighDate = todayStr(); render(); break;
      case "weigh-save": {
        const date = view.weighDate || todayStr();
        const w = Number($("w-whole").value) + Number($("w-tenth").value) / 10;
        const had = date in weights;
        weights[date] = Math.round(w * 10) / 10;
        put("w-" + date, { date, weight: weights[date] });
        view.weighDate = null;
        render();
        toast(`${had ? "Updated" : "Saved"} ${fmtDate(date)}: ${weights[date].toFixed(1)} lb`);
        break;
      }
      case "del-weight": {
        const d = el.dataset.d;
        if (view.pendingDelete !== d) { view.pendingDelete = d; render(); break; }
        view.pendingDelete = null; delete weights[d]; put("w-" + d, null); render(); break;
      }
      case "copy": {
        const text = buildSummary();
        try { await navigator.clipboard.writeText(text); view.copyText = null; render(); toast("Summary copied. Paste it to Claude."); }
        catch { view.copyText = text; render(); const ta = $("copy-text"); if (ta) { ta.focus(); ta.select(); } }
        break;
      }
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.pick) pickW[el.dataset.pick] = Number(el.value);
    else if (el.dataset.picks) pickS[el.dataset.picks] = Number(el.value);
    else if (el.id === "weigh-date") { view.weighDate = el.value || todayStr(); render(); }
    else if (el.id === "set-phase") { settings = { ...settings, phase: el.value, target: PHASES[el.value].target }; put("settings", { ...settings }); render(); }
    else if (el.id === "set-target") { settings = { ...settings, phase: phase(), target: Number(el.value) }; put("settings", { ...settings }); render(); }
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "auth-email") auth.email = e.target.value;
    else if (e.target.id === "auth-pass") auth.pass = e.target.value;
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) importData(e.target.files[0]);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.target.id === "auth-email" || e.target.id === "auth-pass")) doAuth("in");
  });
  // the status-bar band only appears once you scroll, so the sky reaches the top edge
  window.addEventListener("scroll", () => document.body.classList.toggle("scrolled", window.scrollY > 40), { passive: true });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

  connect();
})();
</script>
</body>
</html>
